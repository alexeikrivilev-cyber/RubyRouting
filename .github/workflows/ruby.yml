name: RubyRouting

on:
  push:
  pull_request:

jobs:
  verify:
    name: Fast Ruby verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up CRuby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true

      - name: Run full Ruby verification matrix
        run: |
          bundle check
          bundle exec rake test
          bundle exec rake property
          bundle exec rake model
          bundle exec rake concurrency
          bundle exec rake fault

      - name: Verify authoritative case submission artifacts
        run: |
          bundle exec rake case
          bundle exec rake finalize_submission
          ruby scripts/validate_10.rb routing_decisions_test.json
          bundle exec ruby -Ilib bin/ruby_routing_case_demo > case_demo.json

  product_evidence:
    name: Bounded product evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up CRuby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true

      - name: Run bounded performance and demo evidence
        run: |
          bundle exec rake benchmark
          bundle exec rake load_10k
          bundle exec rake degradation_metrics
          bundle exec rake history_profile
          ruby -Ilib bin/ruby_routing_demo
