name: RubyRouting

on:
  push:
  pull_request:

jobs:
  verify:
    name: Fast Ruby verification
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify preinstalled CRuby
        shell: pwsh
        run: |
          ruby --version
          ruby -e "abort('Expected CRuby 4.0.6, got ' + RUBY_VERSION) unless RUBY_VERSION == '4.0.6'"
          bundle --version

      - name: Run full Ruby verification matrix
        run: |
          bundle check
          bundle exec rake test
          bundle exec rake property
          bundle exec rake model
          bundle exec rake concurrency
          bundle exec rake fault

      - name: Verify authoritative case submission artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bundle exec rake case
          if ($LASTEXITCODE -ne 0) { throw 'case suite failed' }
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("ruby-routing-public-smoke-" + $env:GITHUB_RUN_ID)
          $worktreeAdded = $false
          $locationPushed = $false
          git worktree add --detach $smokeRoot HEAD
          if ($LASTEXITCODE -ne 0) { throw 'public smoke worktree creation failed' }
          $worktreeAdded = $true
          try {
            Push-Location $smokeRoot
            $locationPushed = $true
            bundle exec ruby -Ilib bin/finalize_submission --queue data/operations_queue_10.json
            if ($LASTEXITCODE -ne 0) { throw 'public smoke finalization failed' }
            ruby scripts/validate_10.rb routing_decisions_test.json
            if ($LASTEXITCODE -ne 0) { throw 'public organizer validator failed' }
            bundle exec ruby -Ilib bin/ruby_routing_case_demo > case_demo.json
            if ($LASTEXITCODE -ne 0) { throw 'case demo failed' }
            bundle exec ruby -Ilib bin/ruby_routing_case_evidence > case_evidence.json
            if ($LASTEXITCODE -ne 0) { throw 'case evidence failed' }
          } finally {
            if ($locationPushed) {
              Pop-Location
              $locationPushed = $false
            }
            if ($worktreeAdded) {
              git worktree remove --force -- $smokeRoot
              if ($LASTEXITCODE -ne 0) { throw 'public smoke worktree cleanup failed' }
            }
          }

  product_evidence:
    name: Bounded product evidence
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify preinstalled CRuby
        shell: pwsh
        run: |
          ruby --version
          ruby -e "abort('Expected CRuby 4.0.6, got ' + RUBY_VERSION) unless RUBY_VERSION == '4.0.6'"
          bundle --version

      - name: Run bounded performance and demo evidence
        run: |
          bundle exec rake benchmark
          bundle exec rake load_10k
          bundle exec rake degradation_metrics
          bundle exec rake history_profile
          ruby -Ilib bin/ruby_routing_demo
